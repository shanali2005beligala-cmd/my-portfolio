
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shanali Beligala — Digital Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<style>
:root {
  --purple: #8c6be8;
  --ink: #33284d;
  --muted: #82788f;
  --glass: rgba(255,255,255,.58);
}
* { box-sizing: border-box; }
html,body { margin:0; width:100%; min-height:100%; }
body {
  font-family:Manrope,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 50% 43%,#fff 0%,#f1eaff 43%,transparent 72%),
    linear-gradient(135deg,#f5f0fc,#f9f5fa 55%,#f6edf5);
  overflow:hidden;
}
button { font:inherit; }
#universe {
  position:relative;
  width:100%;
  height:100dvh;
  min-height:540px;
  overflow:hidden;
  isolation:isolate;
}
#stars {
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none;
}
header,footer {
  position:absolute; left:4.2%; right:4.2%;
  display:flex; justify-content:space-between;
  align-items:center; z-index:5;
}
header { top:4%; }
footer { bottom:4%; }
.name {
  font-size:clamp(16px,2vw,23px);
  letter-spacing:5px; font-weight:500;
}
.subtitle,.instruction,.footer-note {
  font-size:10px; letter-spacing:3px;
  text-transform:uppercase; color:var(--muted);
}
.subtitle { margin-top:12px; line-height:2.1; }
.instruction { text-align:right; }
.footer-note { letter-spacing:4px; }
#world {
  position:absolute;
  width:min(780px,100vw);
  height:min(690px,82vh);
  min-height:480px;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  touch-action:pan-y;
}
#globe {
  position:absolute;
  width:58%; aspect-ratio:1;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  cursor:grab;
  filter:drop-shadow(0 12px 42px #9a76e855);
  z-index:1;
}
#globe:active { cursor:grabbing; }
.orbit {
  position:absolute;
  width:94%; height:48%;
  left:3%; top:26%;
  border:1px solid #b9a0f477;
  border-radius:50%;
  transform:rotate(-24deg);
  pointer-events:none;
}
.orbit.two {
  width:104%; height:63%; top:19%; left:-2%;
  transform:rotate(28deg);
  border-color:#b9e8dc99;
}
.orbit.three {
  width:84%; height:82%; top:9%; left:8%;
  transform:rotate(64deg);
  border-color:#f3c5e099;
}
.orbit::after {
  content:""; position:absolute;
  left:14%; top:7%;
  width:8px;height:8px;border-radius:50%;
  background:white;
  box-shadow:0 0 14px 5px #c5b0ff;
}
.bubble {
  position:absolute;
  width:clamp(88px,12vw,130px);
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid #fff;
  background:linear-gradient(145deg,#ffffffcc,#e9dcff88 55%,#ffffffbb);
  box-shadow:inset 0 0 24px #ffffffdd,0 12px 30px #9974c526;
  backdrop-filter:blur(12px);
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  gap:9px;
  color:var(--ink);
  cursor:pointer;
  z-index:3;
  transition:transform .35s,box-shadow .35s;
  animation:float 5s ease-in-out infinite;
}
.bubble:nth-of-type(even) { animation-delay:-2s; }
.bubble:hover,.bubble:focus-visible {
  transform:scale(1.1);
  box-shadow:inset 0 0 30px #fff,0 15px 45px #9270d855;
  outline:none;
}
.bubble .emoji { font-size:27px; }
.bubble .label {
  position:absolute; bottom:-12px;
  padding:10px 14px; white-space:nowrap;
  background:#ffffffdf; border:1px solid #fff;
  border-radius:30px;
  font-size:10px; letter-spacing:2px;
  box-shadow:0 6px 18px #6b4d9910;
}
.projects { left:12%; top:17%; }
.about { left:45%; top:9%; background:linear-gradient(145deg,#fff,#dcd9ffbb); }
.experience { right:5%; top:36%; background:linear-gradient(145deg,#fff,#d9f5eacc); }
.skills { left:5%; top:61%; background:linear-gradient(145deg,#fff,#e1e3ffcc); }
.volunteer { right:20%; bottom:10%; background:linear-gradient(145deg,#fff,#ffe1f0cc); }
.contact { left:33%; bottom:3%; background:linear-gradient(145deg,#fff,#e9d9ffcc); }

#center-text {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:2; text-align:center;
  pointer-events:none;
  width:60%;
  text-shadow:0 2px 18px #8870d344;
}
#center-text small {
  display:block; font-size:10px;
  letter-spacing:4px; margin-bottom:14px;
}
#center-text strong {
  font-size:clamp(16px,2.7vw,26px);
  letter-spacing:7px; font-weight:500;
}
#panel {
  position:absolute; inset:0; z-index:10;
  display:none; align-items:center; justify-content:center;
  padding:22px;
  background:#eee7f5b8; backdrop-filter:blur(17px);
}
#panel.open { display:flex; }
.panel-card {
  position:relative; width:min(610px,100%);
  max-height:82dvh; overflow:auto;
  background:#fffdfdf2;
  border:1px solid white; border-radius:26px;
  padding:clamp(25px,5vw,46px);
  box-shadow:0 25px 90px #58417930;
  animation:appear .3s ease-out;
}
.close {
  position:absolute; top:17px; right:17px;
  border:1px solid #e8dff1; background:white;
  border-radius:50%; width:38px;height:38px;
  font-size:20px; color:var(--ink);
}
.panel-kicker {
  font-size:10px; letter-spacing:3px;
  color:var(--purple); text-transform:uppercase;
}
.panel-card h2 {
  font-size:clamp(30px,5vw,46px);
  letter-spacing:-2px; margin:15px 0;
}
.panel-card p,.panel-card li {
  font-size:13px; line-height:1.9; color:var(--muted);
}
.panel-card h3 { font-size:16px; margin-bottom:5px; }
.entry {
  padding:16px 0; border-top:1px solid #eee7f4;
}
.pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
.pill {
  border:1px solid #e5d9f2; background:#f7f2fc;
  border-radius:30px; padding:9px 12px;
  font-size:11px; color:#6f5993;
}
.email-link { color:var(--purple); overflow-wrap:anywhere; }
@keyframes float {
  0%,100% { margin-top:0; }
  50% { margin-top:-11px; }
}
@keyframes appear {
  from { opacity:0; transform:translateY(12px) scale(.98); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
@media(max-width:600px) {
  header,footer { left:5%;right:5%; }
  header { top:3%; }
  footer { bottom:3%; }
  .name { letter-spacing:3px; }
  .subtitle { font-size:8px; letter-spacing:2px; }
  .instruction { max-width:120px; line-height:1.9; font-size:8px; }
  #world { width:100vw;height:570px;min-height:0; }
  #globe { width:60%; }
  .bubble { width:82px; }
  .bubble .emoji { font-size:22px; }
  .bubble .label { font-size:8px;padding:8px 10px;letter-spacing:1px; }
  .projects { left:5%;top:19%; }
  .about { left:39%;top:9%; }
  .experience { right:1%;top:35%; }
  .skills { left:1%;top:58%; }
  .volunteer { right:12%;bottom:13%; }
  .contact { left:35%;bottom:3%; }
  #center-text strong { letter-spacing:3px;font-size:15px; }
  #center-text small { letter-spacing:2px;font-size:8px; }
  .footer-note { letter-spacing:2px;font-size:8px; }
}
@media(max-height:650px) and (min-width:601px) {
  #world { height:85vh; }
  .bubble { width:92px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important;transition:none!important; }
}
</style>
</head>

<body>
<div id="universe">
  <canvas id="stars"></canvas>

  <header>
    <div>
      <div class="name">Shanali Beligala</div>
      <div class="subtitle">Student<br>Technology<br>Creative solutions</div>
    </div>
    <div class="instruction">Explore · Drag · Click · Discover</div>
  </header>

  <div id="world">
    <div class="orbit"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>
    <canvas id="globe" aria-label="Interactive 3D sphere. Drag to rotate."></canvas>

    <div id="center-text">
      <small>WELCOME TO MY</small>
      <strong>PORTFOLIO</strong>
    </div>

    <button class="bubble projects" data-section="projects" aria-label="Open projects">
      <span class="emoji">▱</span><span class="label">PROJECTS</span>
    </button>
    <button class="bubble about" data-section="about" aria-label="About me">
      <span class="emoji">♙</span><span class="label">ABOUT ME</span>
    </button>
    <button class="bubble experience" data-section="experience" aria-label="Experience">
      <span class="emoji">▣</span><span class="label">EXPERIENCE</span>
    </button>
    <button class="bubble skills" data-section="skills" aria-label="Skills">
      <span class="emoji">✳</span><span class="label">SKILLS</span>
    </button>
    <button class="bubble volunteer" data-section="volunteer" aria-label="Volunteering">
      <span class="emoji">♡</span><span class="label">VOLUNTEERING</span>
    </button>
    <button class="bubble contact" data-section="contact" aria-label="Contact">
      <span class="emoji">✉</span><span class="label">CONTACT</span>
    </button>
  </div>

  <footer>
    <div class="footer-note">Ideas · People · Impact</div>
    <div class="instruction">✦ &nbsp; Drag to explore</div>
  </footer>

  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel-card">
      <button class="close" id="close" aria-label="Close section">×</button>
      <div id="panel-content"></div>
    </div>
  </div>
</div>

<script>
/* ===== 3D SPHERE ===== */
const globeCanvas = document.getElementById("globe");
let renderer, scene, camera, sphereGroup;
let dragging = false, moved = false, lastX = 0, lastY = 0;
let rotX = 0, rotY = 0;

function startGlobe() {
  if (!window.THREE) return;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42,1,.1,100);
  camera.position.z = 5.3;

  renderer = new THREE.WebGLRenderer({
    canvas:globeCanvas, alpha:true, antialias:true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0,0);

  sphereGroup = new THREE.Group();
  scene.add(sphereGroup);

  const geometry = new THREE.IcosahedronGeometry(1.23,5);
  const material = new THREE.MeshPhysicalMaterial({
    color:0xa99af8,
    metalness:.24,
    roughness:.17,
    clearcoat:1,
    clearcoatRoughness:.08,
    iridescence:1,
    iridescenceIOR:1.8,
    iridescenceThicknessRange:[100,800]
  });

  const sphere = new THREE.Mesh(geometry,material);
  sphereGroup.add(sphere);

  const wire = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.25,2),
    new THREE.MeshBasicMaterial({
      color:0xffffff,wireframe:true,
      transparent:true,opacity:.13
    })
  );
  sphereGroup.add(wire);

  scene.add(new THREE.AmbientLight(0xffffff,2.1));

  const light1 = new THREE.PointLight(0xffd8f2,35);
  light1.position.set(-3,3,4);
  scene.add(light1);

  const light2 = new THREE.PointLight(0x9cdcff,30);
  light2.position.set(4,-2,3);
  scene.add(light2);

  const light3 = new THREE.PointLight(0xc5a2ff,20);
  light3.position.set(0,4,-3);
  scene.add(light3);

  // Tiny stars surrounding the sphere
  const count = 650;
  const positions = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const radius=1.55+Math.random()*1.4;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    positions[i*3]=radius*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1]=radius*Math.sin(phi)*Math.sin(theta);
    positions[i*3+2]=radius*Math.cos(phi);
  }

  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position",new THREE.BufferAttribute(positions,3));
  const starField = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({
      color:0xffffff,size:.018,transparent:true,opacity:.9
    })
  );
  scene.add(starField);

  function resize(){
    const rect=globeCanvas.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    renderer.setSize(rect.width,rect.height,false);
    camera.aspect=rect.width/rect.height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize",resize);
  resize();

  globeCanvas.addEventListener("pointerdown",e=>{
    dragging=true;
    moved=false;
    lastX=e.clientX;
    lastY=e.clientY;
    globeCanvas.setPointerCapture(e.pointerId);
  });

  globeCanvas.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
    rotY+=dx*.009;
    rotX+=dy*.009;
    lastX=e.clientX;
    lastY=e.clientY;
  });

  globeCanvas.addEventListener("pointerup",()=>dragging=false);
  globeCanvas.addEventListener("pointercancel",()=>dragging=false);

  function animate(){
    requestAnimationFrame(animate);
    const t=performance.now()*.0003;
    sphereGroup.rotation.y=rotY+(dragging?0:t*.5);
    sphereGroup.rotation.x=rotX+Math.sin(t)*.12;
    starField.rotation.y=-t*.12;
    renderer.render(scene,camera);
  }
  animate();
}

/* Background stars */
const starsCanvas=document.getElementById("stars");
const ctx=starsCanvas.getContext("2d");
let stars=[];

function makeStars(){
  starsCanvas.width=innerWidth*devicePixelRatio;
  starsCanvas.height=innerHeight*devicePixelRatio;
  starsCanvas.style.width=innerWidth+"px";
  starsCanvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  stars=Array.from({length:100},()=>({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.5+.3,
    a:Math.random()*.45+.12,
    phase:Math.random()*6
  }));
}
function drawStars(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const t=performance.now()*.001;
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(151,123,207,${s.a*(.65+.35*Math.sin(t+s.phase))})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
makeStars();
drawStars();
window.addEventListener("resize",makeStars);
startGlobe();

/* ===== CLICKABLE PORTFOLIO SECTIONS ===== */
const content = {
  projects: `
    <div class="panel-kicker">01 / Selected work</div>

  `,
  about: `

    <div class="pills"><span class="pill">Curiosity</span><span class="pill">Creativity</span><span class="pill">Continuous learning</span></div>
  `,
  experience: `
    <div class="panel-kicker">03 / Work experience</div>
    <h2 id="panel-title">Learning by doing.</h2>
    <div class="entry">
      <h3>Information Officer</h3>
      <p><b>Provincial Election · October 2026</b></p>

      <p>Supported the voting process by following ballot-issuing procedures and handling responsibilities carefully.</p>

    <div class="entry">
      <h3>Noon Hour Supervisor</h3>

      <h3>Finishing Operator</h3>
      <p><b>Multi Action Vancouver</b></p>
      <p>Prepare and check orders, verify details, and help ensure accurate packaging and quality control.</p>
    </div>
  `,
  skills: `
    <div class="panel-kicker">04 / My toolkit</div>
    <h2 id="panel-title">Skills in progress.</h2>
    <div class="entry"><h3>Programming</h3><p>Python, Java, C++ · Foundational programming experience.</p></div>
    <div class="entry"><h3>Design & technology</h3><p>Google UX Design Professional Certificate. Google Cybersecurity Professional Certificate in progress.</p></div>
    <div class="entry"><h3>Tools</h3><p>Microsoft Office, Google Workspace, data organization, and documentation.</p></div>
    <div class="entry"><h3>Working with people</h3><p>Communication, teamwork, time management, reliability, and attention to detail.</p></div>
    <div class="entry"><h3>Languages</h3><p>English and Sinhala.</p></div>
  `,
  volunteer: `
    <div class="panel-kicker">05 / Beyond the screen</div>
    <h2 id="panel-title">Community matters.</h2>
    <div class="entry"><h3>$2,550 · BC Cancer Foundation</h3><p>Fundraising to support cancer research and patient care.</p></div>
    <div class="entry"><h3>$500 · BC SPCA</h3><p>Helped raise funds for animal welfare through a bottle drive.</p></div>
    <div class="entry"><h3>Adopt-a-Free-Little-Library</h3><p>Community volunteering to support access to books and neighbourhood connection.</p></div>
    <div class="entry"><h3>Adopt-a-SPOT</h3><p>Volunteering to help care for public spaces in Port Coquitlam.</p></div>
  `,
  contact: `
    <div class="panel-kicker">06 / Get in touch</div>
    <h2 id="panel-title">Let's connect.</h2>
    <p>I'm interested in opportunities to learn, collaborate, and contribute to meaningful projects.</p>
    <div class="entry">
      <h3>Email</h3>
      <p><a class="email-link" href="mailto:shanali2005beligala@gmail.com">shanali2005beligala@gmail.com</a></p>
    </div>
    <div class="entry">
      <h3>LinkedIn</h3>
      <p>Add your LinkedIn profile URL here when ready.</p>
    </div>
    <div class="entry">
      <h3>GitHub</h3>
      <p>Add your GitHub profile URL here to showcase your code.</p>
    </div>
  `
};

const panel=document.getElementById("panel");
const panelContent=document.getElementById("panel-content");
const closeButton=document.getElementById("close");

document.querySelectorAll(".bubble").forEach(button=>{
  button.addEventListener("click",()=>{
    const key=button.dataset.section;
    panelContent.innerHTML=content[key];
    panel.classList.add("open");
    closeButton.focus();
  });
});

function closePanel(){
  panel.classList.remove("open");
}
closeButton.addEventListener("click",closePanel);
panel.addEventListener("click",e=>{
  if(e.target===panel)closePanel();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closePanel();
});
</script>
</body>
</html>
